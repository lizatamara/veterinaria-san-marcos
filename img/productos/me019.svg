<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Background Gradient: Rosa viejo pastel cálido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf6f7"/>
      <stop offset="100%" stop-color="#f5e6e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#733b47" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ambient pattern -->
  <circle cx="820" cy="80" r="180" fill="#7a4852" opacity="0.04"/>
  <circle cx="100" cy="520" r="140" fill="#7a4852" opacity="0.03"/>

  <!-- Left Side: Realistic Product Box & Clinical Info Card -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <!-- Box Body -->
    <rect x="0" y="0" width="400" height="420" rx="20" fill="#ffffff" stroke="#ecdfe2" stroke-width="2"/>
    
    <!-- Top Brand Header Ribbon -->
    <path d="M 0,20 Q 0,0 20,0 L 380,0 Q 400,0 400,20 L 400,85 L 0,85 Z" fill="#7a4852"/>
    
    <!-- Veterinary Cross Icon -->
    <g transform="translate(30, 24)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity="0.2"/>
      <path d="M18,9 L18,27 M9,18 L27,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2">VETERINARIA SAN MARCOS</text>
    <text x="75" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#faeaed" letter-spacing="1">BIOLÓGICO / VACUNA</text>

    <!-- Product Title -->
    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#2e2528">Nobivac Rabies</text>
    
    <!-- Active Ingredient -->
    <rect x="35" y="168" width="330" height="34" rx="8" fill="#f5e8eb"/>
    <text x="50" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7a4852">Principio activo: Vacuna antirrábica</text>

    <!-- Specs Pill Badges -->
    <g transform="translate(35, 225)">
      <!-- Species Badge -->
      <rect x="0" y="0" width="155" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="16" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">ESPECIE</text>
      <text x="16" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Perro / Gato</text>
      
      <!-- Presentation Badge -->
      <rect x="170" y="0" width="160" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="186" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">PRESENTACIÓN</text>
      <text x="186" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Vial 1 dosis</text>
    </g>

    <!-- Clinical Barcode & SKU -->
    <g transform="translate(35, 305)">
      <!-- Barcode bars -->
      <rect x="0" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="7" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="13" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="22" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="28" y="10" width="6" height="42" fill="#4a3e41"/>
      <rect x="38" y="10" width="3" height="42" fill="#4a3e41"/>
      <rect x="45" y="10" width="7" height="42" fill="#4a3e41"/>
      <rect x="56" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="62" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="70" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="79" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="85" y="10" width="6" height="42" fill="#4a3e41"/>
      <text x="45" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="#786b6f">REF: ME019</text>
      
      <!-- Seal of Quality Stamp -->
      <circle cx="270" cy="32" r="30" fill="none" stroke="#7a4852" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="270" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#7a4852">CALIDAD</text>
      <text x="270" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#7a4852">GARANTIZADA</text>
    </g>
  </g>

  <!-- Right Side: 3D Object Render -->
  
        <!-- Realistic Glass Vaccine Vial -->
        <g transform="translate(500, 110)">
          <!-- Shadow -->
          <ellipse cx="130" cy="380" rx="95" ry="22" fill="#6e3d46" opacity="0.2" filter="blur(6px)"/>
          
          <!-- Vial Glass Body -->
          <defs>
            <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
              <stop offset="30%" stop-color="#fdf4f6" stop-opacity="0.5"/>
              <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#ecd6db" stop-opacity="0.95"/>
            </linearGradient>
            <linearGradient id="crimpedCap" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#d1d5db"/>
              <stop offset="40%" stop-color="#f3f4f6"/>
              <stop offset="80%" stop-color="#9ca3af"/>
              <stop offset="100%" stop-color="#7a4852"/>
            </linearGradient>
          </defs>
          
          <!-- Rubber Stopper & Crimped Aluminum Seal -->
          <rect x="100" y="20" width="60" height="24" rx="4" fill="url(#crimpedCap)"/>
          <ellipse cx="130" cy="20" rx="30" ry="8" fill="#7a4852"/>
          <circle cx="130" cy="20" r="10" fill="#4b5563"/>
          
          <!-- Glass Neck -->
          <rect x="110" y="44" width="40" height="25" fill="url(#vialGlass)" stroke="#d9c5c9"/>
          
          <!-- Glass Body -->
          <path d="M 110,69 C 90,80 70,105 70,135 L 70,345 C 70,365 95,375 130,375 C 165,375 190,365 190,345 L 190,135 C 190,105 170,80 150,69 Z" fill="url(#vialGlass)" stroke="#cfb8be" stroke-width="2"/>
          
          <!-- Liquid Vaccine Inside -->
          <path d="M 74,210 L 74,342 C 74,360 96,370 130,370 C 164,370 186,360 186,342 L 186,210 C 160,215 100,205 74,210 Z" fill="#f5e8eb" opacity="0.8"/>
          
          <!-- Specular Glass Highlight -->
          <path d="M 85,140 L 85,340 C 85,345 88,350 92,350 L 92,140 Z" fill="#ffffff" opacity="0.75"/>
          
          <!-- Clinical Label -->
          <rect x="76" y="145" width="108" height="145" rx="6" fill="#ffffff" stroke="#e8d5d9" stroke-width="1"/>
          <rect x="76" y="145" width="108" height="24" rx="4" fill="#7a4852"/>
          <text x="130" y="161" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">VACUNA VET</text>
          <text x="130" y="190" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#2e2528">Nobivac Rabies</text>
          <text x="130" y="206" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#786b6f">1 Dosis / Vial</text>
          <text x="130" y="240" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#7a4852">Inyectable</text>
          <rect x="95" y="260" width="70" height="16" rx="4" fill="#f5e8eb"/>
          <text x="130" y="272" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#7a4852">USO EXCLUSIVO VET</text>
        </g>
        
</svg>
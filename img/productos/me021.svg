<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Background Gradient: Rosa viejo pastel cálido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf6f7"/>
      <stop offset="100%" stop-color="#f5e6e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#733b47" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ambient pattern -->
  <circle cx="820" cy="80" r="180" fill="#b36b77" opacity="0.04"/>
  <circle cx="100" cy="520" r="140" fill="#b36b77" opacity="0.03"/>

  <!-- Left Side: Realistic Product Box & Clinical Info Card -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <!-- Box Body -->
    <rect x="0" y="0" width="400" height="420" rx="20" fill="#ffffff" stroke="#ecdfe2" stroke-width="2"/>
    
    <!-- Top Brand Header Ribbon -->
    <path d="M 0,20 Q 0,0 20,0 L 380,0 Q 400,0 400,20 L 400,85 L 0,85 Z" fill="#b36b77"/>
    
    <!-- Veterinary Cross Icon -->
    <g transform="translate(30, 24)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity="0.2"/>
      <path d="M18,9 L18,27 M9,18 L27,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2">VETERINARIA SAN MARCOS</text>
    <text x="75" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#faeaed" letter-spacing="1">USO VETERINARIO</text>

    <!-- Product Title -->
    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#2e2528">Omega vet 3-6-9</text>
    
    <!-- Active Ingredient -->
    <rect x="35" y="168" width="330" height="34" rx="8" fill="#fcf2f4"/>
    <text x="50" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#b36b77">Principio activo: Ácidos grasos omega</text>

    <!-- Specs Pill Badges -->
    <g transform="translate(35, 225)">
      <!-- Species Badge -->
      <rect x="0" y="0" width="155" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="16" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">ESPECIE</text>
      <text x="16" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Perro / Gato</text>
      
      <!-- Presentation Badge -->
      <rect x="170" y="0" width="160" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="186" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">PRESENTACIÓN</text>
      <text x="186" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Frasco 100ml</text>
    </g>

    <!-- Clinical Barcode & SKU -->
    <g transform="translate(35, 305)">
      <!-- Barcode bars -->
      <rect x="0" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="7" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="13" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="22" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="28" y="10" width="6" height="42" fill="#4a3e41"/>
      <rect x="38" y="10" width="3" height="42" fill="#4a3e41"/>
      <rect x="45" y="10" width="7" height="42" fill="#4a3e41"/>
      <rect x="56" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="62" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="70" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="79" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="85" y="10" width="6" height="42" fill="#4a3e41"/>
      <text x="45" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="#786b6f">REF: ME021</text>
      
      <!-- Seal of Quality Stamp -->
      <circle cx="270" cy="32" r="30" fill="none" stroke="#b36b77" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="270" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#b36b77">CALIDAD</text>
      <text x="270" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#b36b77">GARANTIZADA</text>
    </g>
  </g>

  <!-- Right Side: 3D Object Render -->
  
        <!-- Realistic 3D Medical Bottle -->
        <g transform="translate(490, 80)">
          <!-- Shadow -->
          <ellipse cx="140" cy="430" rx="110" ry="24" fill="#6e3d46" opacity="0.18" filter="blur(6px)"/>
          
          <!-- Bottle Body -->
          <defs>
            <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="25%" stop-color="#f5e8eb"/>
              <stop offset="70%" stop-color="#ffffff"/>
              <stop offset="90%" stop-color="#e8d5d9"/>
              <stop offset="100%" stop-color="#d4bfc4"/>
            </linearGradient>
            <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#b36b77"/>
              <stop offset="50%" stop-color="#d98997"/>
              <stop offset="100%" stop-color="#6e3540"/>
            </linearGradient>
          </defs>
          
          <!-- Pump / Cap -->
          <rect x="122" y="10" width="36" height="35" rx="4" fill="url(#capGrad)"/>
          <rect x="110" y="45" width="60" height="25" rx="5" fill="#e2cfd3"/>
          <rect x="125" y="70" width="30" height="25" fill="#f5e8eb"/>
          <path d="M125,22 Q85,20 80,32 Q85,42 125,35 Z" fill="url(#capGrad)"/>
          
          <!-- Shoulder and Body -->
          <path d="M 105,95 C 105,95 70,120 60,160 L 60,395 C 60,415 85,425 140,425 C 195,425 220,415 220,395 L 220,160 C 210,120 175,95 175,95 Z" fill="url(#botGrad)" stroke="#d9c5c9" stroke-width="2"/>
          
          <!-- Gloss highlight -->
          <path d="M 80,165 L 80,390 C 80,395 85,400 90,400 L 90,165 Z" fill="#ffffff" opacity="0.6"/>
          
          <!-- Realistic Label on Bottle -->
          <rect x="72" y="180" width="136" height="185" rx="8" fill="#ffffff" stroke="#ecdce0" stroke-width="1.5"/>
          <rect x="72" y="180" width="136" height="32" rx="6" fill="#b36b77"/>
          <text x="140" y="201" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">VET PHARMA</text>
          <text x="140" y="235" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#2e2528">Omega vet 3-6-9</text>
          <text x="140" y="253" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#786b6f">Ácidos grasos omeg</text>
          
          <!-- Cross symbol & volume -->
          <circle cx="140" cy="290" r="16" fill="#fcf2f4"/>
          <path d="M140,280 L140,300 M130,290 L150,290" stroke="#b36b77" stroke-width="3" stroke-linecap="round"/>
          <text x="140" y="340" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#b36b77">Frasco 100ml</text>
          <rect x="90" y="348" width="100" height="4" fill="#e8d8dc" rx="2"/>
        </g>
        
</svg>
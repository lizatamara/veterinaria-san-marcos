<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Background Gradient: Rosa viejo pastel cálido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf6f7"/>
      <stop offset="100%" stop-color="#f5e6e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#733b47" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ambient pattern -->
  <circle cx="820" cy="80" r="180" fill="#9b5a66" opacity="0.04"/>
  <circle cx="100" cy="520" r="140" fill="#9b5a66" opacity="0.03"/>

  <!-- Left Side: Realistic Product Box & Clinical Info Card -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <!-- Box Body -->
    <rect x="0" y="0" width="400" height="420" rx="20" fill="#ffffff" stroke="#ecdfe2" stroke-width="2"/>
    
    <!-- Top Brand Header Ribbon -->
    <path d="M 0,20 Q 0,0 20,0 L 380,0 Q 400,0 400,20 L 400,85 L 0,85 Z" fill="#9b5a66"/>
    
    <!-- Veterinary Cross Icon -->
    <g transform="translate(30, 24)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity="0.2"/>
      <path d="M18,9 L18,27 M9,18 L27,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2">VETERINARIA SAN MARCOS</text>
    <text x="75" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#faeaed" letter-spacing="1">ANTIPARASITARIO</text>

    <!-- Product Title -->
    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#2e2528">Revolution Plus</text>
    
    <!-- Active Ingredient -->
    <rect x="35" y="168" width="330" height="34" rx="8" fill="#faecef"/>
    <text x="50" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9b5a66">Principio activo: Selamectina+Sarolaner</text>

    <!-- Specs Pill Badges -->
    <g transform="translate(35, 225)">
      <!-- Species Badge -->
      <rect x="0" y="0" width="155" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="16" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">ESPECIE</text>
      <text x="16" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Gato</text>
      
      <!-- Presentation Badge -->
      <rect x="170" y="0" width="160" height="44" rx="10" fill="#faf4f5" stroke="#ecdce0" stroke-width="1"/>
      <text x="186" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">PRESENTACIÓN</text>
      <text x="186" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Pipeta 1 unid.</text>
    </g>

    <!-- Clinical Barcode & SKU -->
    <g transform="translate(35, 305)">
      <!-- Barcode bars -->
      <rect x="0" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="7" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="13" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="22" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="28" y="10" width="6" height="42" fill="#4a3e41"/>
      <rect x="38" y="10" width="3" height="42" fill="#4a3e41"/>
      <rect x="45" y="10" width="7" height="42" fill="#4a3e41"/>
      <rect x="56" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="62" y="10" width="4" height="42" fill="#4a3e41"/>
      <rect x="70" y="10" width="5" height="42" fill="#4a3e41"/>
      <rect x="79" y="10" width="2" height="42" fill="#4a3e41"/>
      <rect x="85" y="10" width="6" height="42" fill="#4a3e41"/>
      <text x="45" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="#786b6f">REF: ME006</text>
      
      <!-- Seal of Quality Stamp -->
      <circle cx="270" cy="32" r="30" fill="none" stroke="#9b5a66" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="270" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#9b5a66">CALIDAD</text>
      <text x="270" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#9b5a66">GARANTIZADA</text>
    </g>
  </g>

  <!-- Right Side: 3D Object Render -->
  
        <!-- Realistic Spot-on Pipette Applicator -->
        <g transform="translate(510, 100)">
          <!-- Shadow -->
          <ellipse cx="120" cy="380" rx="80" ry="20" fill="#6e3d46" opacity="0.2" filter="blur(6px)"/>
          
          <!-- Pipette Shape -->
          <defs>
            <linearGradient id="pipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="35%" stop-color="#fcf2f4"/>
              <stop offset="85%" stop-color="#ecd6db"/>
              <stop offset="100%" stop-color="#d9bfc6"/>
            </linearGradient>
          </defs>
          
          <!-- Break-off Cap -->
          <path d="M 105,30 L 135,30 L 125,85 L 115,85 Z" fill="#9b5a66"/>
          <line x1="110" y1="85" x2="130" y2="85" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,2"/>
          
          <!-- Pipette Reservoir Bulb -->
          <path d="M 115,85 L 125,85 L 145,130 C 180,180 185,270 170,320 C 155,360 135,370 120,370 C 105,370 85,360 70,320 C 55,270 60,180 95,130 Z" fill="url(#pipGrad)" stroke="#cfb8be" stroke-width="2"/>
          
          <!-- Medicine Volume Inside (Translucent) -->
          <path d="M 100,160 C 75,200 70,270 82,310 C 95,350 110,358 120,358 C 130,358 145,350 158,310 C 170,270 165,200 140,160 Z" fill="#9b5a66" opacity="0.35"/>
          
          <!-- Pipette Measurement Marks -->
          <line x1="90" y1="210" x2="110" y2="210" stroke="#786b6f" stroke-width="1.5"/>
          <line x1="95" y1="240" x2="110" y2="240" stroke="#786b6f" stroke-width="1.5"/>
          <line x1="90" y1="270" x2="110" y2="270" stroke="#786b6f" stroke-width="1.5"/>
          <text x="120" y="274" font-family="'Segoe UI', sans-serif" font-size="9" fill="#786b6f">ml</text>
          
          <!-- Highlight -->
          <path d="M 85,150 C 75,190 75,280 85,320" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>
        
</svg>
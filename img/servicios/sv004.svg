<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Background Gradient: Rosa viejo pastel cálido -->
    <linearGradient id="servBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf6f7"/>
      <stop offset="100%" stop-color="#f7eaed"/>
    </linearGradient>
    <filter id="servShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#733b47" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#servBgGrad)"/>

  <!-- Left Side: Procedural Info Card -->
  <g transform="translate(60, 90)" filter="url(#servShadow)">
    <rect x="0" y="0" width="390" height="420" rx="20" fill="#ffffff" stroke="#ecdfe2" stroke-width="2"/>
    
    <!-- Top Header Ribbon -->
    <path d="M 0,20 Q 0,0 20,0 L 370,0 Q 390,0 390,20 L 390,85 L 0,85 Z" fill="#b36b77"/>
    
    <g transform="translate(30, 24)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity="0.2"/>
      <path d="M18,9 L18,27 M9,18 L27,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">PROCEDIMIENTO CLÍNICO</text>
    <text x="75" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#faeaed" letter-spacing="1">CONSULTAS</text>

    <!-- Procedure Name -->
    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2e2528">Consulta ave / conejo</text>
    

    <!-- Badges -->
    <g transform="translate(35, 220)">
      <rect x="0" y="0" width="150" height="46" rx="10" fill="#fcf2f4" stroke="#ecdce0" stroke-width="1"/>
      <text x="16" y="19" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">ESPECIE</text>
      <text x="16" y="35" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Ave / Conejo</text>

      <rect x="165" y="0" width="150" height="46" rx="10" fill="#fcf2f4" stroke="#ecdce0" stroke-width="1"/>
      <text x="181" y="19" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">DURACIÓN EST.</text>
      <text x="181" y="35" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">30 minutos</text>
    </g>

    <!-- Guarantee badge -->
    <g transform="translate(35, 310)">
      <rect x="0" y="0" width="320" height="60" rx="12" fill="#faf5f6" stroke="#ebd8dc" stroke-width="1.5"/>
      <circle cx="35" cy="30" r="16" fill="#b36b77"/>
      <path d="M28,30 L33,35 L42,25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="27" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2e2528">Atención Profesional Certificada</text>
      <text x="65" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#786b6f">Veterinaria San Marcos</text>
    </g>
  </g>

  <!-- Right Side: Service Drawing -->
  
        <!-- Drawing: Consulta / Estetoscopio y Mascota -->
        <g transform="translate(480, 100)">
          <!-- Warm background circle -->
          <circle cx="160" cy="180" r="160" fill="#fcf2f4" stroke="#eddce0" stroke-width="3"/>
          <circle cx="160" cy="180" r="135" fill="#ffffff" opacity="0.8"/>
          
          <!-- Cute Pet Drawing (Dog/Cat ears & face outline) -->
          <path d="M 90,170 C 80,110 110,90 125,125 C 145,115 175,115 195,125 C 210,90 240,110 230,170 C 235,230 85,230 90,170 Z" fill="#faecef" stroke="#3d2b2f" stroke-width="4" stroke-linejoin="round"/>
          <!-- Eyes & Nose -->
          <ellipse cx="135" cy="165" rx="5" ry="7" fill="#3d2b2f"/>
          <ellipse cx="185" cy="165" rx="5" ry="7" fill="#3d2b2f"/>
          <circle cx="137" cy="163" r="2" fill="#ffffff"/>
          <circle cx="187" cy="163" r="2" fill="#ffffff"/>
          <!-- Snout & Heart Nose -->
          <path d="M 154,180 Q 160,174 166,180 Q 160,190 154,180 Z" fill="#b36b77"/>
          <path d="M 160,188 L 160,196 Q 152,202 144,196 M 160,196 Q 168,202 176,196" fill="none" stroke="#3d2b2f" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Stethoscope Drawing -->
          <path d="M 85,250 C 70,310 160,330 200,290 C 220,270 230,220 230,220" fill="none" stroke="#8c4b56" stroke-width="7" stroke-linecap="round"/>
          <path d="M 85,250 C 70,310 160,330 200,290 C 220,270 230,220 230,220" fill="none" stroke="#fcebef" stroke-width="3" stroke-linecap="round"/>
          <!-- Chest piece -->
          <circle cx="230" cy="220" r="18" fill="#e2cfd3" stroke="#3d2b2f" stroke-width="4"/>
          <circle cx="230" cy="220" r="10" fill="#b36b77"/>
          
          <!-- Floating Heart Drawing -->
          <path d="M 160,50 C 145,25 110,40 125,75 L 160,105 L 195,75 C 210,40 175,25 160,50 Z" fill="#b36b77" stroke="#3d2b2f" stroke-width="3"/>
        </g>
        
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Background Gradient: Rosa viejo pastel cálido -->
    <linearGradient id="servBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf6f7"/>
      <stop offset="100%" stop-color="#f7eaed"/>
    </linearGradient>
    <filter id="servShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#733b47" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#servBgGrad)"/>

  <!-- Left Side: Procedural Info Card -->
  <g transform="translate(60, 90)" filter="url(#servShadow)">
    <rect x="0" y="0" width="390" height="420" rx="20" fill="#ffffff" stroke="#ecdfe2" stroke-width="2"/>
    
    <!-- Top Header Ribbon -->
    <path d="M 0,20 Q 0,0 20,0 L 370,0 Q 390,0 390,20 L 390,85 L 0,85 Z" fill="#b36b77"/>
    
    <g transform="translate(30, 24)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity="0.2"/>
      <path d="M18,9 L18,27 M9,18 L27,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">PROCEDIMIENTO CLÍNICO</text>
    <text x="75" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#faeaed" letter-spacing="1">CIRUGÍA</text>

    <!-- Procedure Name -->
    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2e2528">Esterilización hembra fe</text>
    <text x="35" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#2e2528">lina</text>

    <!-- Badges -->
    <g transform="translate(35, 220)">
      <rect x="0" y="0" width="150" height="46" rx="10" fill="#fcf2f4" stroke="#ecdce0" stroke-width="1"/>
      <text x="16" y="19" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">ESPECIE</text>
      <text x="16" y="35" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">Gata</text>

      <rect x="165" y="0" width="150" height="46" rx="10" fill="#fcf2f4" stroke="#ecdce0" stroke-width="1"/>
      <text x="181" y="19" font-family="'Segoe UI', sans-serif" font-size="10" fill="#786b6f">DURACIÓN EST.</text>
      <text x="181" y="35" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2e2528">60 minutos</text>
    </g>

    <!-- Guarantee badge -->
    <g transform="translate(35, 310)">
      <rect x="0" y="0" width="320" height="60" rx="12" fill="#faf5f6" stroke="#ebd8dc" stroke-width="1.5"/>
      <circle cx="35" cy="30" r="16" fill="#b36b77"/>
      <path d="M28,30 L33,35 L42,25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="27" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2e2528">Atención Profesional Certificada</text>
      <text x="65" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#786b6f">Veterinaria San Marcos</text>
    </g>
  </g>

  <!-- Right Side: Service Drawing -->
  
        <!-- Drawing: Procedimiento Quirúrgico / Cirugía -->
        <g transform="translate(480, 90)">
          <!-- Rounded Backdrop -->
          <rect x="30" y="20" width="270" height="320" rx="40" fill="#fcf2f4" stroke="#ebd5da" stroke-width="4"/>
          
          <!-- Surgical Cross in circle -->
          <circle cx="165" cy="110" r="55" fill="#ffffff" stroke="#b36b77" stroke-width="4"/>
          <path d="M 165,80 L 165,140 M 135,110 L 195,110" stroke="#b36b77" stroke-width="12" stroke-linecap="round"/>
          
          <!-- Heartbeat / EKG Pulse Line -->
          <path d="M 45,210 L 110,210 L 130,170 L 150,250 L 175,190 L 195,220 L 285,220" fill="none" stroke="#8c4b56" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Scalpel Illustration -->
          <g transform="translate(100, 260) rotate(-25)">
            <rect x="20" y="10" width="110" height="16" rx="4" fill="#cbd5e1" stroke="#3d2b2f" stroke-width="3"/>
            <!-- Blade -->
            <path d="M 130,10 L 175,22 Q 150,30 130,26 Z" fill="#f1f5f9" stroke="#3d2b2f" stroke-width="3"/>
          </g>
        </g>
        
</svg>